<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline';"
    />
    <title>Recall</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        width: 620px;
        height: 340px;
        background: #faf3ec;
        color: #4a3732;
        font-family:
          Segoe UI,
          Arial,
          sans-serif;
        padding: 34px 38px;
        overflow: hidden;
        border: 1px solid #4a373244;
      }
      header {
        display: flex;
        align-items: center;
        gap: 13px;
      }
      img {
        width: 54px;
        height: 54px;
      }
      header strong {
        font-size: 23px;
        font-weight: 600;
        letter-spacing: -1px;
      }
      header small {
        display: block;
        font-size: 10px;
        margin-top: 5px;
        letter-spacing: 0.12em;
        opacity: 0.8;
      }
      h1 {
        font-family: Georgia, serif;
        font-size: 32px;
        font-weight: 400;
        margin: 30px 0 9px;
      }
      p {
        font-size: 15px;
        margin: 0;
      }
      footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-top: 1px solid #4a373240;
        padding-top: 17px;
        margin-top: 30px;
        font-size: 11px;
      }
      footer span:last-child {
        font-size: 12px;
      }
      .dots {
        letter-spacing: 3px;
        margin-inline-end: 8px;
      }
      header {
        justify-content: center;
      }
      header img {
        width: 48px;
        height: 48px;
      }
      header small {
        display: none;
      }
      h1 {
        text-align: center;
        margin-top: 35px;
        font-size: 30px;
      }
      body > p {
        text-align: center;
      }
      footer {
        margin-top: 35px;
      }
    </style>
  </head>
  <body>
    <header>
      <img src="app-icon.png" alt="" />
      <div>
        <strong>Recall</strong><small>A LITTLE PRACTICE, EVERY DAY</small>
      </div>
    </header>
    <h1>Make room for what matters.</h1>
    <p lang="ar" dir="rtl">مساحة للي يستاهل تفتكره.</p>
    <footer>
      <span><b class="dots">•••</b>Opening your workspace</span
      ><span lang="ar" dir="rtl">جارٍ فتح مساحة العمل</span>
    </footer>
  </body>
</html>
